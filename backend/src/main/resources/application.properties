# =====================================================================
# Camisa 10 – configuração padrão (PostgreSQL)
# Para rodar sem instalar nada, use o perfil "dev" (H2 em memória):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================
spring.application.name=camisa10
server.port=8080

# --- Banco de dados (PostgreSQL) ---
# Os valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/camisa10}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA ---
# "update" cria/ajusta as tabelas sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# Em produção, defina a variável de ambiente JWT_SECRET (mínimo de 32 caracteres).
# O valor abaixo serve apenas para desenvolvimento.
camisa10.jwt.secret=${JWT_SECRET:camisa10-segredo-de-desenvolvimento-troque-em-producao}
camisa10.jwt.expiracao-horas=24

# --- Regras de negócio da personalização (RF11) ---
camisa10.personalizacao.valor-acrescimo=25.00
camisa10.personalizacao.max-caracteres-nome=12

# --- Upload de imagens dos produtos (RF05) ---
# Pasta onde as imagens são gravadas (relativa à pasta onde a API é iniciada).
# As imagens ficam disponíveis em GET /uploads/{arquivo}.
camisa10.upload.dir=uploads

# Catálogo de fotos de camisas que acompanha o projeto (relativo à pasta backend/)
camisa10.catalogo.dir=${CATALOGO_DIR:catalogo-fotos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
