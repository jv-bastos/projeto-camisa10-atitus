# =====================================================================
# Camisa 10 – configuração padrão (PostgreSQL)
# Para rodar sem instalar nada, use o perfil "dev" (H2 em memória):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================
spring.application.name=camisa10
server.port=8080

# --- Banco de dados (PostgreSQL) ---
# Os valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/camisa10}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA ---
# "update" cria/ajusta as tabelas sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Regras de negócio da personalização (RF11) ---
camisa10.personalizacao.valor-acrescimo=25.00
camisa10.personalizacao.max-caracteres-nome=12
