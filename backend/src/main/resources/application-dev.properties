# =====================================================================
# Perfil "dev": banco H2 em memória (não precisa instalar nada).
# Os dados são recriados a cada inicialização pelo DataSeeder.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:camisa10;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Console web do H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:camisa10 – usuário: sa – senha em branco)
spring.h2.console.enabled=true
